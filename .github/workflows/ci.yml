name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=ragless --cov-report=term-missing --cov-fail-under=85

  test-semantic-slow:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,semantic,tokens,graph]"
      - run: pytest -q --run-slow -m slow

  build:
    needs: [test, test-semantic-slow]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - name: Smoke test the built wheel
        run: |
          cd /tmp
          python -c "
          import ragless
          r = ragless.Retriever(['hello world', 'goodbye world'])
          assert r.search('hello')
          ctx = r.context('hello', max_tokens=200, graph=True)
          assert ctx.passages
          print('ragless', ragless.__version__, 'smoke test OK')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
